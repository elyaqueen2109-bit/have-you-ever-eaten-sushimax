<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Max — Voice Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  .floating-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden; z-index: 0;
    pointer-events: none;
  }

  .floating-bg span {
    position: absolute; display: block;
    border-radius: 50%; opacity: 0.35;
    animation: floatUp 18s infinite ease-in-out;
    filter: blur(40px);
  }
  .floating-bg span:nth-child(1) { width: 320px; height: 320px; background: #ff00ff; left: -120px; top: 5%; animation-duration: 20s; }
  .floating-bg span:nth-child(2) { width: 260px; height: 260px; background: #00ffff; right: -100px; top: 15%; animation-duration: 24s; animation-delay: -6s; }
  .floating-bg span:nth-child(3) { width: 220px; height: 220px; background: #ffff00; left: 35%; bottom: -100px; animation-duration: 22s; animation-delay: -11s; }
  .floating-bg span:nth-child(4) { width: 360px; height: 360px; background: #ff0080; right: 5%; bottom: -160px; animation-duration: 28s; animation-delay: -4s; }
  .floating-bg span:nth-child(5) { width: 200px; height: 200px; background: #00ff88; left: 55%; top: -60px; animation-duration: 19s; animation-delay: -8s; }

  @keyframes floatUp {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -50px) scale(1.1); }
    50% { transform: translate(-30px, 40px) scale(0.95); }
    75% { transform: translate(50px, 25px) scale(1.05); }
  }

  .card {
    position: relative; z-index: 2;
    width: 100%; max-width: 820px;
    background: rgba(18, 18, 38, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 30px 28px;
    text-align: center;
    box-shadow:
      0 0 50px rgba(255, 0, 255, 0.25),
      0 0 100px rgba(0, 255, 255, 0.12);
    max-height: 95vh;
    overflow-y: auto;
  }

  .card::before {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 32px; padding: 2px;
    background: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #00ff88, #ff00ff);
    background-size: 400% 400%;
    animation: neonBorder 6s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes neonBorder {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }

  h1 {
    font-size: 1.8rem; font-weight: 800;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: neonBorder 4s linear infinite;
    letter-spacing: 1px;
  }

  .progress {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* === ГЕРОЙ === */
  .hero-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .hero-photo-wrap { position: relative; }

  .hero-photo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ff00ff;
    box-shadow: 0 0 30px rgba(255, 0, 255, 0.7), 0 0 60px rgba(0, 255, 255, 0.4);
    display: block;
    background: #1a1a2e;
  }

  .hero-photo-wrap::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 3px dashed #ffff00;
    animation: spinBorder 12s linear infinite;
    pointer-events: none;
  }

  .hero-photo.speaking {
    animation: heroSpeak 0.6s ease-in-out infinite;
  }

  @keyframes heroSpeak {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 255, 0.7), 0 0 60px rgba(0, 255, 255, 0.4); }
    50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(255, 0, 255, 1), 0 0 90px rgba(0, 255, 255, 0.8); }
  }

  @keyframes spinBorder {
    to { transform: rotate(360deg); }
  }

  .hero-name {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 10px;
    text-align: center;
  }

  /* === ЧАТ — теперь только 2 блока === */
  .chat-area {
    max-width: 620px;
    margin: 0 auto 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 100px;
    padding: 5px;
    scroll-behavior: smooth;
  }

  .message {
    padding: 14px 20px;
    border-radius: 18px;
    font-size: 1.15rem;
    line-height: 1.4;
    letter-spacing: 0.3px;
    opacity: 0;
    transform: translateY(10px);
    animation: msgAppear 0.4s ease-out forwards;
    text-align: center;
    font-weight: 600;
  }

  @keyframes msgAppear {
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-question {
    background: rgba(0, 255, 255, 0.1);
    border: 2px solid #00ffff;
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff;
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
    font-size: 1.4rem;
  }

  .msg-answer {
    background: rgba(0, 255, 136, 0.1);
    border: 2px solid #00ff88;
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
    font-size: 1.2rem;
  }

  .msg-hint {
    background: rgba(255, 255, 0, 0.06);
    border: 2px dashed #ffff00;
    color: #ffff00;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 18px;
    font-weight: 400;
  }

  .msg-label {
    font-size: 0.65rem;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 5px;
    display: block;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .main-btn {
    border: none;
    padding: 13px 26px;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 800;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }

  .main-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .main-btn.roll {
    background: linear-gradient(135deg, #ff00ff, #00ffff);
    color: #0a0a1a;
    box-shadow: 0 0 25px rgba(255, 0, 255, 0.5), 0 0 50px rgba(0, 255, 255, 0.3);
  }

  .main-btn:hover:not(:disabled) { transform: scale(1.05); }
  .main-btn:active:not(:disabled) { transform: scale(0.97); }

  .main-btn.mic {
    background: linear-gradient(135deg, #ff0080, #ff00ff);
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
    display: none;
  }

  .main-btn.mic.show { display: inline-block; }

  .main-btn.mic.listening {
    animation: listeningPulse 1s ease-in-out infinite;
  }

  @keyframes listeningPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 128, 0.5); }
    50% { box-shadow: 0 0 40px rgba(255, 0, 128, 1), 0 0 80px rgba(255, 0, 255, 0.6); }
  }

  .given-area {
    margin: 15px 0;
    min-height: 60px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }

  .given-chip {
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid #00ffff;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 1.2rem;
    font-weight: 700;
    color: #00ffff;
    text-shadow: 0 0 12px #00ffff;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    opacity: 0;
    transform: translateY(15px) scale(0.9);
    animation: chipAppear 0.45s ease-out forwards;
  }

  @keyframes chipAppear {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .footer {
    margin-top: 15px;
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.15);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .status {
    font-size: 0.8rem;
    color: #ffff00;
    letter-spacing: 2px;
    text-transform: uppercase;
    min-height: 20px;
    margin-top: 8px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="floating-bg">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="card">
  <h1>Chat with Max</h1>
  <div class="progress" id="progress">Present Perfect — Voice Game</div>

  <div class="hero-row">
    <div>
      <div class="hero-photo-wrap">
        <img id="heroPhoto" class="hero-photo" alt="Max" src="max.png" />
      </div>
      <div class="hero-name">MAX, 13</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="main-btn roll" id="rollBtn" onclick="nextQuestion()">Start Game 🎲</button>
    <button class="main-btn mic" id="micBtn" onclick="startListening()">🎤 Speak</button>
  </div>

  <div class="status" id="status"></div>

  <div class="given-area" id="givenArea"></div>

  <div class="chat-area" id="chatArea"></div>

  <div class="footer">Speak English ✦ Have fun</div>
</div>

<script>
  // ============================================================
  // КАРТИНКА МАКСА
  // ============================================================
  const avatarUrl = "max.png";
  document.getElementById('heroPhoto').src = avatarUrl;
  // ============================================================

  // ---- Звуки ----
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;
  function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

  function playClick() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 900; osc.type = 'square';
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.04);
  }

  function playDing() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 1400; osc.type = 'sine';
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.5);
  }

  function playPop() {
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 500; osc.type = 'triangle';
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
  }

  // ---- Озвучка Макса ----
  function speak(text, callback) {
    if (!('speechSynthesis' in window)) {
      if (callback) callback();
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.95;
    utterance.pitch = 0.9;

    const voices = window.speechSynthesis.getVoices();
    const maleVoice = voices.find(v =>
      v.lang.startsWith('en') && /male|david|mark|george|daniel|james|alex/i.test(v.name)
    );
    const anyEnVoice = voices.find(v => v.lang.startsWith('en'));
    if (maleVoice) utterance.voice = maleVoice;
    else if (anyEnVoice) utterance.voice = anyEnVoice;

    const photo = document.getElementById('heroPhoto');
    photo.classList.add('speaking');

    utterance.onend = () => {
      photo.classList.remove('speaking');
      if (callback) callback();
    };

    window.speechSynthesis.speak(utterance);
  }

  // ---- Задания ----
  const allTasks = [
    { words: ["you", "ever", "try", "spicy food"], question: "Have you ever tried spicy food?", reply: "Yes, I have! It was really hot!" },
    { words: ["you", "ever", "eat", "sushi"], question: "Have you ever eaten sushi?", reply: "No, I haven't. But I'd love to try it!" },
    { words: ["you", "ever", "ride", "a horse"], question: "Have you ever ridden a horse?", reply: "Yes, I have. It was amazing!" },
    { words: ["you", "ever", "break", "a phone"], question: "Have you ever broken a phone?", reply: "Yes, I have. My mum was so angry!" },
    { words: ["you", "ever", "see", "a shark"], question: "Have you ever seen a shark?", reply: "No, I haven't. I'm a bit scared of them!" },
    { words: ["you", "ever", "make", "a cake"], question: "Have you ever made a cake?", reply: "Yes, I have. It was a chocolate cake!" },
    { words: ["you", "ever", "be", "to London"], question: "Have you ever been to London?", reply: "No, I haven't. But I want to see Big Ben!" },
    { words: ["you", "ever", "lose", "your keys"], question: "Have you ever lost your keys?", reply: "Yes, I have. I lost them at school!" },
    { words: ["you", "ever", "write", "a poem"], question: "Have you ever written a poem?", reply: "Yes, I have. It was about my dog!" },
    { words: ["you", "ever", "drink", "green tea"], question: "Have you ever drunk green tea?", reply: "No, I haven't. I prefer hot chocolate!" },
    { words: ["you", "ever", "sleep", "in a tent"], question: "Have you ever slept in a tent?", reply: "Yes, I have. It was cold but fun!" },
    { words: ["you", "ever", "fly", "in a plane"], question: "Have you ever flown in a plane?", reply: "Yes, I have. I went to Spain last year!" }
  ];

  let shuffledTasks = [];
  let currentIndex = 0;
  let currentTask = null;
  let currentStep = 'idle';

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function clearChat() {
    document.getElementById('chatArea').innerHTML = '';
  }

  function showQuestion(text) {
    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'message msg-question';
    msg.innerHTML = '<span class="msg-label">YOUR QUESTION</span>' + text;
    chatArea.appendChild(msg);
  }

  function showAnswer(text) {
    const chatArea = document.getElementById('chatArea');
    const msg = document.createElement('div');
    msg.className = 'message msg-answer';
    msg.innerHTML = '<span class="msg-label">MAX</span>' + text;
    chatArea.appendChild(msg);
  }

  function showHint(text) {
    const chatArea = document.getElementById('chatArea');
    const msg = document.createElement('div');
    msg.className = 'message msg-hint';
    msg.textContent = text;
    chatArea.appendChild(msg);
  }

  // ---- СТАРТ ИГРЫ ----
  function nextQuestion() {
    const rollBtn = document.getElementById('rollBtn');
    const micBtn = document.getElementById('micBtn');
    const givenArea = document.getElementById('givenArea');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');

    if (currentStep === 'idle' && shuffledTasks.length === 0) {
      shuffledTasks = shuffle(allTasks);
      currentIndex = 0;
      clearChat();
    }

    if (currentIndex >= shuffledTasks.length) {
      // Все вопросы заданы
      clearChat();
      showHint('You asked all 12 questions! Great job! 🎉');
      status.textContent = '✅ Game over! Refresh to play again.';
      progress.textContent = 'Game complete!';
      rollBtn.disabled = true;
      rollBtn.textContent = 'Done! 🎉';
      micBtn.classList.remove('show');
      return;
    }

    currentTask = shuffledTasks[currentIndex];
    currentIndex++;

    givenArea.innerHTML = '';
    micBtn.classList.remove('show');
    clearChat();

    progress.textContent = `Question ${currentIndex} of ${shuffledTasks.length}`;

    const shuffled = [...currentTask.words].sort(() => Math.random() - 0.5);
    shuffled.forEach((word, i) => {
      const chip = document.createElement('div');
      chip.className = 'given-chip';
      chip.textContent = word;
      chip.style.animationDelay = (i * 0.1) + 's';
      givenArea.appendChild(chip);
      playClick();
    });

    rollBtn.disabled = true;
    rollBtn.textContent = 'Next Question 🎲';

    setTimeout(() => {
      showHint('Ask me a question with these words! 🎤');
      status.textContent = '🎤 Tap "Speak" and ask Max a question';
      micBtn.classList.add('show');
      currentStep = 'askMax';
      playDing();
    }, shuffled.length * 100 + 400);
  }

  // ---- МИКРОФОН ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micPermissionGranted = false;

  async function requestMicOnce() {
    if (micPermissionGranted) return true;
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
      micPermissionGranted = true;
      return true;
    } catch (err) {
      return false;
    }
  }

  async function startListening() {
    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');

    if (!SpeechRecognition) {
      status.textContent = '❌ Voice recognition not supported. Use Chrome or Edge.';
      return;
    }

    const allowed = await requestMicOnce();
    if (!allowed) {
      status.textContent = '❌ Microphone access denied.';
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    micBtn.classList.add('listening');
    micBtn.textContent = '🎤 Listening...';
    status.textContent = '🔴 Speak now!';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      handleSpeech(transcript);
    };

    recognition.onerror = () => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤 Speak';
      status.textContent = '⚠️ Could not hear you. Try again.';
    };

    recognition.onend = () => {
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤 Speak';
    };

    recognition.start();
  }

  // ---- ОБРАБОТКА РЕЧИ ----
  function handleSpeech(transcript) {
    const status = document.getElementById('status');
    const micBtn = document.getElementById('micBtn');
    const rollBtn = document.getElementById('rollBtn');
    const chatArea = document.getElementById('chatArea');

    micBtn.classList.remove('show');
    playPop();

    // Показываем ПРАВИЛЬНЫЙ вопрос (собранный из слов) с вопросительным знаком
    chatArea.innerHTML = '';
    showQuestion(currentTask.question);

    // Затем показываем ответ Макса
    status.textContent = '⏳ Max is thinking...';

    setTimeout(() => {
      showAnswer(currentTask.reply);
      speak(currentTask.reply, () => {
        setTimeout(() => {
          rollBtn.disabled = false;
          status.textContent = '✅ Tap "Next Question" to continue';
          currentStep = 'idle';
        }, 400);
      });
    }, 800);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }
</script>

</body>
</html>
